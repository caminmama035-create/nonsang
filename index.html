function sparkle(x,y,n){var e=["✦","✧","♡","⋆"];for(var i=0;i<(n||5);i++){var s=document.createElement("span");s.className="spark";s.textContent=e[i%e.length];s.style.left=x+"px";s.style.top=y+"px";s.style.color=["#f08ab8","#b48af0","#7cc9a8","#f0b45a"][i%4];var a=Math.random()*6.28,r=30+Math.random()*30;s.style.setProperty("--dx",Math.cos(a)*r+"px");s.style.setProperty("--dy",Math.sin(a)*r+"px");document.body.appendChild(s);setTimeout(function(t){t.remove()}.bind(null,s),850)}}
function confetti(){setTimeout(function(){try{stickerRain()}catch(e){}},0);if(window.matchMedia&&matchMedia("(prefers-reduced-motion: reduce)").matches)return;var c=["#f7a8cf","#c9a8f0","#9fdcc3","#ffd68a","#a8d0f5"];for(var i=0;i<40;i++){var d=document.createElement("div");d.className="conf";d.style.left=Math.random()*100+"vw";d.style.background=c[i%5];document.body.appendChild(d);d.animate([{transform:"translateY(0) rotate(0)",opacity:1},{transform:"translateY("+(innerHeight+40)+"px) translateX("+(Math.random()*120-60)+"px) rotate("+(Math.random()*720)+"deg)",opacity:.9}],{duration:1800+Math.random()*1400,easing:"cubic-bezier(.2,.6,.4,1)",delay:Math.random()*300}).onfinish=function(){this.effect.target.remove()}}}
function buildDeco(){var b=document.querySelector(".bgfx");if(!b)return;b.querySelectorAll(".flt").forEach(function(x){x.remove()});if(!(CFG.deco||[]).length)return;var L=[["a","4%","12%",46,-10],["b","80%","5%",52,10],["c","74%","30%",40,-14],["d","-3%","40%",56,6],["e","88%","54%",40,12],["f","1%","70%",50,4],["g","84%","80%",40,-8],["h","42%","7%",36,16],["i","60%","66%",42,6]];L.forEach(function(x,i){x[0]=CFG.deco[i%CFG.deco.length]});L.forEach(function(x,i){var d=document.createElement("div");d.className="flt";d.style.cssText="left:"+x[1]+";top:"+x[2]+";width:"+x[3]+"px;--r:"+x[4]+"deg;--d:"+(6+i%4)+"s;--dl:"+(i*.7)+"s";d.innerHTML='<img class="stk" src="'+esc(x[0])+'" alt="">';b.appendChild(d)})}
function stickerRain(){if(window.matchMedia&&matchMedia("(prefers-reduced-motion: reduce)").matches)return;var k=(CFG.deco||[]).concat(CFG.mascot?[CFG.mascot]:[]);if(!k.length)return;for(var i=0;i<8;i++){var im=document.createElement("img");im.className="rainst";im.alt="";im.src=k[Math.floor(Math.random()*k.length)];im.style.left=(Math.random()*85)+"vw";document.body.appendChild(im);im.animate([{transform:"translateY(0) rotate(0)"},{transform:"translateY("+(innerHeight+120)+"px) rotate("+(Math.random()*360-180)+"deg)"}],{duration:2200+Math.random()*1200,delay:Math.random()*500,easing:"cubic-bezier(.3,.5,.5,1)"}).onfinish=function(){this.effect.target.remove()}}}
document.addEventListener("click",function(e){var t=e.target.closest&&e.target.closest(".hst");if(t){t.classList.remove("wig");void t.offsetWidth;t.classList.add("wig");var r=t.getBoundingClientRect();sparkle(r.left+r.width/2,r.top+r.height/3,10)}});
document.addEventListener("pointerdown",function(e){if(e.target.closest&&e.target.closest("button,.brand img"))sparkle(e.clientX,e.clientY,6)});
document.addEventListener("click",function(e){if(e.target.closest&&e.target.closest(".brand img")){var im=e.target;im.classList.remove("wig");void im.offsetWidth;im.classList.add("wig")}});
function toast(m){var t=document.createElement("div");t.className="toast";t.setAttribute("role","status");t.textContent=m;document.body.appendChild(t);setTimeout(function(){t.remove()},2600)}
function total(){return S.cart.reduce(function(a,i){return a+i.price},0)}
function tlv(i,v){return i+String(v.length).padStart(2,"0")+v}
function crc16(s){var c=65535,i,j;for(i=0;i<s.length;i++){c^=s.charCodeAt(i)<<8;for(j=0;j<8;j++)c=(c&32768)?((c<<1)^4129):(c<<1);c&=65535}return c.toString(16).toUpperCase().padStart(4,"0")}
function ppQR(phone,amt){var dg=String(phone).replace(/\D/g,"");var m=tlv("00","A000000677010111")+(dg.length===13?tlv("02",dg):dg.length===15?tlv("03",dg):tlv("01","0066"+dg.replace(/^0/,"")));var p=tlv("00","01")+tlv("01","12")+tlv("29",m)+tlv("53","764")+tlv("54",amt.toFixed(2))+tlv("58","TH")+"6304";p+=crc16(p);var q=qrcode(0,"M");q.addData(p);q.make();return q.createSvgTag(4,0)}
function stTag(s){return s==="approved"?'<span class="tag o">ส่งไฟล์แล้ว</span>':s==="rejected"?'<span class="tag b">ไม่ผ่านการตรวจ</span>':'<span class="tag w">รอตรวจสลิป</span>'}
function fmt(d){return new Date(d).toLocaleString("th-TH",{dateStyle:"short",timeStyle:"short"})}

async function loadCFG(){try{var r=await sb.from("shop_settings").select("data").eq("id",1).maybeSingle();if(r.data&&r.data.data)CFG=Object.assign({},DEF,r.data.data)}catch(e){}applyCFG()}
async function boot(){
 await loadCFG();
 var r=await sb.auth.getSession();
 await setUser(r.data.session?r.data.session.user:null);
 sb.auth.onAuthStateChange(function(e,s){var u=s?s.user:null;if((u&&u.id)!==(S.user&&S.user.id))setUser(u)});
}
async function setUser(u){
 S.user=u;S.admin=false;S.cart=[];S.tab="shop";
 if(u){
  var a=await sb.from("admins").select("user_id").eq("user_id",u.id).maybeSingle();
  S.admin=!!a.data;
  await loadProducts();
  if(S.pending){var pp=S.products.filter(function(x){return x.id===S.pending})[0];if(pp){S.cart.push(pp);toast("เพิ่มลงตะกร้าแล้ว")}S.pending=null}
 }else{await loadProducts()}
 render();
}
async function loadProducts(){
 var r=await sb.from("products").select("*").order("name");
 S.products=r.data||[];
}
async function loadOrders(){
 var r=await sb.from("orders").select("*, order_items(price, product_id, products(name))").eq("user_id",S.user.id).order("created_at",{ascending:false});
 S.orders=r.data||[];
 var l=await sb.from("product_files").select("product_id, drive_url");
 S.links={};(l.data||[]).forEach(function(x){S.links[x.product_id]=x.drive_url});
}
async function loadAll(){
 var r=await sb.from("orders").select("*, order_items(price, product_id, products(name))").order("created_at",{ascending:false});
 S.all=r.data||[];
 var l=await sb.from("product_files").select("product_id, drive_url");S.links={};(l.data||[]).forEach(function(x){S.links[x.product_id]=x.drive_url});
}
async function go(t){
 S.tab=t;
 if(t==="orders")await loadOrders();
 if(t==="admin"||t==="stats")await loadAll();
 if(t==="settings")S.draft=JSON.parse(JSON.stringify(CFG));
 if(t==="manage"){S.edit=null;await loadProducts();var lk=await sb.from("product_files").select("product_id, drive_url");S.links={};(lk.data||[]).forEach(function(x){S.links[x.product_id]=x.drive_url})}
 render();
}
function render(){
 var a=$("#app");var _k=(S.user?"u":"g")+S.tab;a.classList.toggle("enter",S._last!==_k);S._last=_k;
 if(!S.user){
  if(S.tab==="login"){a.innerHTML=authView();bindAuth();return}
  a.innerHTML='<div class="top"><div class="brand">'+logoHTML()+'<h1>'+esc(CFG.name)+'</h1></div><button class="btn" id="lg">เข้าสู่ระบบ</button></div>'+shopV()+SEA();
  $("#lg").onclick=function(){S.tab="login";S.mode="login";render()};
  bindMain();return}
 var tabs=[["shop","สินค้า"],["cart","ตะกร้า ("+S.cart.length+")"],["orders","คำสั่งซื้อของฉัน"]];
 if(S.admin)tabs.push(["admin","แอดมิน: ตรวจสลิป"],["manage","แอดมิน: จัดการสินค้า"],["stats","แอดมิน: สรุปยอด"],["settings","แอดมิน: ตั้งค่าร้าน"]);
 var nav='<nav>'+tabs.map(function(t){return '<button data-t="'+t[0]+'"'+(S.tab===t[0]||(S.tab==="pay"&&t[0]==="cart")?' aria-current="true"':"")+'>'+t[1]+'</button>'}).join("")+'</nav>';
 var h='<div class="top"><div class="brand">'+logoHTML()+'<h1>'+esc(CFG.name)+'</h1></div><button class="btn ghost" id="lo">ออกจากระบบ</button></div><div class="mute" style="margin-bottom:8px">'+esc(S.user.email)+'</div>'+nav;
 if(S.admin&&!CFG.pp&&S.tab!=="settings")h+='<div class="warn">⚠️ ร้านยังไม่ได้ตั้งค่าช่องทางรับเงิน ลูกค้าจะยังชำระเงินไม่ได้ <a href="#" data-t2="settings">ไปตั้งค่าร้าน →</a></div>';
 h+=({shop:shopV,cart:cartV,pay:payV,orders:ordersV,admin:adminV,manage:manageV,stats:statsV,settings:settingsV}[S.tab]||shopV)();
 a.innerHTML=h+SEA();
 $("#lo").onclick=function(){sb.auth.signOut()};
 $("nav").onclick=function(e){if(e.target.dataset.t)go(e.target.dataset.t)};
 bindMain();
}
function authView(){
 var su=S.mode==="signup";
 return '<div class="top"><div class="brand">'+logoHTML()+'<h1>'+esc(CFG.name)+'</h1></div></div><div class="box authdeco">'+stk("peek","a1")+stk("paw","a2")+'<h2>'+(su?"สมัครสมาชิก":"เข้าสู่ระบบ")+'</h2><p class="mute">'+(S.pending?"เข้าสู่ระบบหรือสมัครสมาชิกด้วยอีเมลเพื่อใส่ตะกร้าและสั่งซื้อ":"ต้องเข้าสู่ระบบด้วยอีเมลก่อนจึงจะสั่งซื้อและรับไฟล์ได้")+'</p><label for="em">อีเมล</label><input id="em" type="email" autocomplete="email"><label for="pw">รหัสผ่าน (อย่างน้อย 6 ตัว)</label><input id="pw" type="password" autocomplete="'+(su?"new-password":"current-password")+'"><button class="btn" id="go">'+(su?"สมัครสมาชิก":"เข้าสู่ระบบ")+'</button> <button class="btn ghost" id="sw">'+(su?"มีบัญชีแล้ว":"สมัครสมาชิกใหม่")+'</button></div><button class="btn ghost" id="bk">← กลับไปดูสินค้า</button>'

function bindAuth(){
 $("#bk").onclick=function(){S.pending=null;S.tab="shop";render()};
 $("#sw").onclick=function(){S.mode=S.mode==="signup"?"login":"signup";render()};
 $("#go").onclick=async function(){
  var e=$("#em").value.trim(),p=$("#pw").value;
  if(e.indexOf("@")<1||p.length<6){toast("กรอกอีเมลและรหัสผ่านให้ครบ (รหัสอย่างน้อย 6 ตัว)");return}
  var r=S.mode==="signup"?await sb.auth.signUp({email:e,password:p}):await sb.auth.signInWithPassword({email:e,password:p});
  if(r.error){var em=(r.error.message||"").toLowerCase();toast(em.indexOf("confirm")>=0?"อีเมลนี้ยังไม่ได้ยืนยัน กรุณากดลิงก์ยืนยันในอีเมล (เช็กในจดหมายขยะด้วย) หรือทักร้าน":em.indexOf("rate limit")>=0?"ระบบส่งอีเมลเต็มชั่วคราว กรุณาลองใหม่ภายหลังหรือทักร้าน":S.mode==="signup"?"สมัครไม่สำเร็จ: "+r.error.message:"อีเมลหรือรหัสผ่านไม่ถูกต้อง");return}
  if(S.mode==="signup"&&!r.data.session)toast("สมัครแล้ว กรุณายืนยันอีเมลก่อนเข้าสู่ระบบ");
 };
}

function manageV(){
 if(S.edit)return editV();
 var f='<div class="box"><h2>เพิ่มสินค้า</h2><label for="pn">ชื่อสินค้า</label><input id="pn"><label for="pd">คำอธิบาย</label><textarea id="pd" rows="3"></textarea><label for="pp">ราคา (บาท)</label><input id="pp" type="number" inputmode="numeric"><label for="pi">รูปปกสินค้า (ไม่บังคับ)</label><input id="pi" type="file" accept="image/*"><label for="pv">ลิงก์ไดร์ฟรูปตัวอย่าง (ไม่บังคับ ลูกค้าเห็นได้ทุกคน)</label><input id="pv" type="url" placeholder="https://drive.google.com/..."><label for="pl">ลิงก์ไดร์ฟของไฟล์สินค้า (ส่งให้เฉพาะคนที่จ่ายแล้ว)</label><input id="pl" type="url" placeholder="https://drive.google.com/..."><button class="btn" id="pa">บันทึกสินค้า</button></div>';
 var l=S.products.map(function(p){return '<div class="row"><span>'+esc(p.name)+' ฿'+p.price+(p.active?"":' <span class="tag b">ซ่อนอยู่</span>')+'</span><span><button class="btn ghost" data-ed="'+p.id+'">แก้ไข</button> <button class="btn ghost" data-cv="'+p.id+'">รูปปก</button> <button class="btn ghost" data-tg="'+p.id+'">'+(p.active?"ซ่อน":"แสดง")+'</button></span></div>'}).join("");
 return f+'<input id="cvf" type="file" accept="image/*" hidden><div class="box"><h2>สินค้าทั้งหมด</h2>'+(l||'<p class="mute">ยังไม่มีสินค้า</p>')+'</div>';
}
function bindMain(){
 var a=$("#app");
 a.onclick=async function(e){
  var d=e.target.dataset;if(!d)return;
  if(d.add&&!S.user){S.pending=d.add;S.tab="login";S.mode="login";toast("กรุณาเข้าสู่ระบบก่อนใส่ตะกร้า");render();return}
  if(d.add){var p=S.products.filter(function(x){return x.id===d.add})[0];S.cart.push(p);toast("เพิ่มลงตะกร้าแล้ว 🛒");render();var cb=document.querySelector('nav [data-t="cart"]');if(cb){cb.classList.add("bump");var r=cb.getBoundingClientRect();sparkle(r.left+r.width/2,r.top+r.height/2,8)}}
  if(d.rm){S.cart.splice(+d.rm,1);render()}
  if(d.t2)go(d.t2);
  if(d.slip){var r=await sb.storage.from("slips").createSignedUrl(d.slip,300);if(r.data)window.open(r.data.signedUrl,"_blank");else toast("เปิดสลิปไม่ได้")}
  if(d.ok||d.no){var r2=await sb.from("orders").update({status:d.ok?"approved":"rejected"}).eq("id",d.ok||d.no);if(r2.error)toast("บันทึกไม่สำเร็จ: "+r2.error.message);else{toast(d.ok?"อนุมัติแล้ว ลูกค้าจะเห็นลิงก์ไฟล์":"บันทึกแล้ว");if(d.ok)confetti();go("admin")}}
  if(d.cp){try{navigator.clipboard.writeText(d.cp);toast("คัดลอกอีเมลแล้ว")}catch(e){toast(d.cp)}return}
  if(d.lay){S.layout=d.lay;try{localStorage.setItem("layout",d.lay)}catch(e){}render();return}
  if(d.th){var t=THEMES[d.th];S.draft.c1=t[0];S.draft.c2=t[1];S.draft.bg=t[2];render();return}
  if(d.rm1){S.draft[d.rm1]="";render();return}
  if(d.rmd!==undefined){S.draft.deco.splice(+d.rmd,1);render();return}
  if(d.rg){S.range=d.rg;render();return}
  if(d.ed){S.edit=d.ed;render();window.scrollTo(0,0)}
  if(d.cv){var inp=$("#cvf");inp.onchange=async function(){var pf=inp.files[0];if(!pf)return;var ex=(pf.name.split(".").pop()||"jpg").replace(/[^a-z0-9]/gi,"").toLowerCase()||"jpg";var cp=Date.now()+"."+ex;var up=await sb.storage.from("covers").upload(cp,pf);if(up.error){toast("อัปโหลดไม่สำเร็จ: "+up.error.message);return}var u=sb.storage.from("covers").getPublicUrl(cp).data.publicUrl;var rr=await sb.from("products").update({image_url:u}).eq("id",d.cv);if(rr.error)toast("บันทึกไม่สำเร็จ: "+rr.error.message);else{toast("เปลี่ยนรูปปกแล้ว");go("manage")}};inp.click()}
  if(d.tg){var p2=S.products.filter(function(x){return x.id===d.tg})[0];await sb.from("products").update({active:!p2.active}).eq("id",d.tg);go("manage")}
 };
 if($("#sp"))$("#sp").onclick=submitOrder;
 if($("#pa"))$("#pa").onclick=addProduct;
 if($("#csv"))$("#csv").onclick=dlCSV;
 bindSettings();
 if($("#ec"))$("#ec").onclick=function(){S.edit=null;render()};
 if($("#es"))$("#es").onclick=saveEdit;
}
async function submitOrder(){
 if(S.busy)return;
 var ge=($("#ge").value||"").trim();if(ge.indexOf("@")<1){toast("กรอกอีเมล Google สำหรับรับไฟล์ก่อนนะ");return}
 var f=$("#sl").files[0];
 if(!f){toast("แนบสลิปก่อนส่ง");return}
 S.busy=true;$("#sp").disabled=true;
 try{
  var ext=(f.name.split(".").pop()||"jpg").replace(/[^a-z0-9]/gi,"").toLowerCase()||"jpg";
  var path=S.user.id+"/"+Date.now()+"."+ext;
  var up=await sb.storage.from("slips").upload(path,f);
  if(up.error)throw up.error;
  var o=await sb.from("orders").insert({user_id:S.user.id,email:S.user.email,drive_email:ge,total:total(),slip_path:path}).select().single();
  if(o.error)throw o.error;
  var it=await sb.from("order_items").insert(S.cart.map(function(x){return {order_id:o.data.id,product_id:x.id,price:x.price}}));
  if(it.error)throw it.error;
  S.cart=[];confetti();(function(){var d=document.createElement("div");d.className="thx";d.innerHTML='<div>'+stk("thanks")+'<p><b>ส่งสลิปแล้ว!</b></p><p class="mute">ร้านจะแชร์ไฟล์ให้ภายใน 24 ชม. 💌</p></div>';d.onclick=function(){d.remove()};document.body.appendChild(d);setTimeout(function(){d.remove()},3800)})();await go("orders");
 }catch(err){toast("ส่งไม่สำเร็จ: "+(err.message||err));$("#sp").disabled=false}
 S.busy=false;
}
async function addProduct(){
 var n=$("#pn").value.trim(),d=$("#pd").value.trim(),p=parseInt($("#pp").value,10),l=$("#pl").value.trim();
 if(!n||!(p>0)||l.indexOf("http")!==0){toast("กรอกชื่อ ราคา และลิงก์ให้ครบ");return}
 var pvu=$("#pv").value.trim();if(pvu&&pvu.indexOf("http")!==0){toast("ลิงก์รูปตัวอย่างต้องขึ้นต้นด้วย http");return}
 var imgUrl=null,pf=$("#pi").files[0];
 if(pf){var ex=(pf.name.split(".").pop()||"jpg").replace(/[^a-z0-9]/gi,"").toLowerCase()||"jpg";var cp=Date.now()+"."+ex;var up=await sb.storage.from("covers").upload(cp,pf);if(up.error){toast("อัปโหลดรูปไม่สำเร็จ: "+up.error.message);return}imgUrl=sb.storage.from("covers").getPublicUrl(cp).data.publicUrl}
 var r=await sb.from("products").insert({name:n,description:d,price:p,image_url:imgUrl,preview_url:pvu||null}).select().single();
 if(r.error){toast("บันทึกไม่สำเร็จ: "+r.error.message);return}
 var r2=await sb.from("product_files").insert({product_id:r.data.id,drive_url:l});
 if(r2.error){toast("บันทึกลิงก์ไม่สำเร็จ: "+r2.error.message);return}
 toast("เพิ่มสินค้าแล้ว");go("manage");
}
async function saveEdit(){
 var id=S.edit,n=$("#en").value.trim(),d=$("#ed").value.trim(),p=parseInt($("#ep").value,10),l=$("#el").value.trim();
 if(!n||!(p>0)||l.indexOf("http")!==0){toast("กรอกชื่อ ราคา และลิงก์ให้ครบ");return}
 var evu=$("#ev").value.trim();if(evu&&evu.indexOf("http")!==0){toast("ลิงก์รูปตัวอย่างต้องขึ้นต้นด้วย http");return}
 var upd={name:n,description:d,price:p,preview_url:evu||null},pf=$("#ei").files[0];
 if(pf){var ex=(pf.name.split(".").pop()||"jpg").replace(/[^a-z0-9]/gi,"").toLowerCase()||"jpg";var cp=Date.now()+"."+ex;var up=await sb.storage.from("covers").upload(cp,pf);if(up.error){toast("อัปโหลดรูปไม่สำเร็จ: "+up.error.message);return}upd.image_url=sb.storage.from("covers").getPublicUrl(cp).data.publicUrl}
 var r=await sb.from("products").update(upd).eq("id",id);
 if(r.error){toast("บันทึกไม่สำเร็จ: "+r.error.message);return}
 var ex2=await sb.from("product_files").select("product_id").eq("product_id",id).maybeSingle();
 var r2=ex2.data?await sb.from("product_files").update({drive_url:l}).eq("product_id",id):await sb.from("product_files").insert({product_id:id,drive_url:l});
 if(r2.error){toast("บันทึกลิงก์ไม่สำเร็จ: "+r2.error.message);return}
 toast("บันทึกแล้ว");go("manage");
}

function statsV(){
 var R=S.range||"month",now=new Date(),d0=new Date(now.getFullYear(),now.getMonth(),now.getDate());
 var from=R==="today"?d0:R==="7"?new Date(d0-6*864e5):R==="month"?new Date(now.getFullYear(),now.getMonth(),1):new Date(0);
 var ap=S.all.filter(function(o){return o.status==="approved"});
 var inR=ap.filter(function(o){return new Date(o.created_at)>=from});
 var sum=function(a){return a.reduce(function(t,o){return t+(+o.total||0)},0)};
 var pend=S.all.filter(function(o){return o.status==="pending"});
 var rej=S.all.filter(function(o){return o.status==="rejected"&&new Date(o.created_at)>=from}).length;
 var cust={};inR.forEach(function(o){cust[o.email]=1});
 var seg='<div class="seg">'+[["today","วันนี้"],["7","7 วัน"],["month","เดือนนี้"],["all","ทั้งหมด"]].map(function(x){return '<button data-rg="'+x[0]+'" aria-pressed="'+(R===x[0])+'">'+x[1]+'</button>'}).join("")+'</div>';
 var k='<div class="kpis"><div class="kpi"><div class="l">รายรับ (อนุมัติแล้ว)</div><div class="v">฿'+sum(inR).toLocaleString()+'</div><div class="s">'+inR.length+' ออเดอร์</div></div>'
  +'<div class="kpi"><div class="l">ลูกค้า</div><div class="v">'+Object.keys(cust).length+'</div><div class="s">คน ในช่วงนี้</div></div>'
  +'<div class="kpi"><div class="l">รอตรวจสลิป</div><div class="v">'+pend.length+'</div><div class="s">ยอดรอ ฿'+sum(pend).toLocaleString()+'</div></div>'
  +'<div class="kpi"><div class="l">รายรับรวมทั้งหมด</div><div class="v">฿'+sum(ap).toLocaleString()+'</div><div class="s">ไม่ผ่านในช่วงนี้ '+rej+' ออเดอร์</div></div></div>';
 var days=[];for(var i=13;i>=0;i--){var a=new Date(d0-i*864e5),b=new Date(+a+864e5);days.push({l:a.getDate(),v:sum(ap.filter(function(o){var t=new Date(o.created_at);return t>=a&&t<b}))})}
 var mx=Math.max.apply(null,days.map(function(x){return x.v}))||1;
 var ch='<div class="box"><h3>รายรับรายวัน (14 วันล่าสุด)</h3><div class="bars" role="img" aria-label="กราฟรายรับรายวัน">'+days.map(function(x){return '<div title="฿'+x.v+'">'+(x.v?'<b>'+x.v+'</b>':'')+'<i style="height:'+(x.v/mx*85)+'%"></i>'+x.l+'</div>'}).join("")+'</div></div>';
 var bp={};inR.forEach(function(o){(o.order_items||[]).forEach(function(i){var n=i.products?i.products.name:"สินค้า";bp[n]=bp[n]||{n:0,v:0};bp[n].n++;bp[n].v+=(+i.price||0)})});
 var pl=Object.keys(bp).sort(function(a,b){return bp[b].v-bp[a].v});
 var pt='<div class="box"><h3>ขายดีในช่วงนี้</h3>'+(pl.length?pl.map(function(n){return '<div class="row"><span>'+esc(n)+'</span><span class="mute">'+bp[n].n+' ชิ้น · <b style="color:#e56aa3">฿'+bp[n].v.toLocaleString()+'</b></span></div>'}).join(""):'<p class="mute">ยังไม่มียอดขายในช่วงนี้</p>')+'</div>';
 return seg+k+ch+pt+'<button class="btn ghost" id="csv">ดาวน์โหลดรายการออเดอร์ (Excel/CSV)</button>';
}
function dlCSV(){
 var rows=[["เลขออเดอร์","วันที่","อีเมลลูกค้า","อีเมลรับไฟล์","สินค้า","ยอด","สถานะ"]];
 S.all.forEach(function(o){rows.push([o.id,new Date(o.created_at).toLocaleString("th-TH"),o.email||"",o.drive_email||"",(o.order_items||[]).map(function(i){return i.products?i.products.name:""}).join(" / "),o.total,o.status==="approved"?"อนุมัติ":o.status==="rejected"?"ไม่ผ่าน":"รอตรวจ"])});
 var c="﻿"+rows.map(function(r){return r.map(function(x){return '"'+String(x).replace(/"/g,'""')+'"'}).join(",")}).join("\n");
 var a=document.createElement("a");a.href=URL.createObjectURL(new Blob([c],{type:"text/csv;charset=utf-8"}));a.download="orders-"+new Date().toISOString().slice(0,10)+".csv";a.click();
}

 var c=S.draft||(S.draft=JSON.parse(JSON.stringify(CFG)));
 function f(id,l,v,ph,t){return '<label for="'+id+'">'+l+'</label><input id="'+id+'" data-k="'+id.slice(2)+'" value="'+esc(v)+'" placeholder="'+(ph||"")+'"'+(t?' type="'+t+'"':'')+'>'}
 function img(k,l,u){return '<label>'+l+'</label><div class="thumbs">'+(u?'<span><img src="'+esc(u)+'" alt=""><button data-rm1="'+k+'" aria-label="ลบ">✕</button></span>':'')+'</div><input type="file" accept="image/*" data-up="'+k+'">'}
 return '<div class="box set"><h2>ตั้งค่าร้าน</h2><p class="mute">แก้แล้วกด "บันทึก" ด้านล่าง หน้าร้านจะเปลี่ยนทันที</p>'
 +'<h3>ข้อมูลร้าน</h3>'+f("s_name","ชื่อร้าน",c.name)+f("s_tagline","คำโปรยบนแบนเนอร์",c.tagline)
 +img("logo","โลโก้ร้าน (รูปวงกลม)",c.logo)
 +'<h3>ธีมสี</h3><div class="sw">'+Object.keys(THEMES).map(function(k){var t=THEMES[k];return '<button data-th="'+k+'" style="background:linear-gradient(135deg,'+t[0]+','+t[1]+')">'+k+'</button>'}).join("")+'</div>'

 +img("bgimg","รูปพื้นหลัง (ไม่บังคับ)",c.bgimg)
 +'<h3>ของตกแต่ง</h3>'+img("mascot","มาสคอตร้าน (โชว์บนแบนเนอร์ และหน้าต่างขอบคุณ)",c.mascot)
 +'<label>ของตกแต่งลอยพื้นหลัง + แถวท้ายหน้า (PNG พื้นใส ใส่ได้หลายรูป)</label><div class="thumbs">'+(c.deco||[]).map(function(u,i){return '<span><img src="'+esc(u)+'" alt=""><button data-rmd="'+i+'" aria-label="ลบ">✕</button></span>'}).join("")+'</div><input type="file" accept="image/*" multiple data-up="deco">'
 +'<h3>ช่องทางรับเงิน</h3>'+f("s_pp","พร้อมเพย์ (เบอร์โทร หรือ เลขบัตรประชาชน 13 หลัก)",c.pp,"0812345678")+f("s_acct","ชื่อบัญชี",c.acct)
 +f("s_bank","ธนาคาร (ไม่บังคับ)",c.bank,"เช่น กสิกรไทย")+f("s_bankno","เลขบัญชีธนาคาร (ไม่บังคับ)",c.bankno)+f("s_tmw","เบอร์ TrueMoney Wallet (ไม่บังคับ)",c.tmw)
 +'<button class="btn ghost" id="qrt">ดูตัวอย่าง QR (ลองสแกน 1 บาท)</button><div id="qrp"></div>'
 +'<h3>การติดต่อ และข้อความ</h3>'+f("s_fb","ลิงก์ติดต่อร้าน (Facebook / LINE / IG)",c.fb,"https://")+'<label for="s_note">ข้อความแจ้งลูกค้าหน้าชำระเงิน</label><textarea id="s_note" data-k="note" rows="2">'+esc(c.note)+'</textarea>'
 +'<button class="btn" id="sv" style="margin-top:8px">บันทึกการตั้งค่า</button></div>';

function bindSettings(){
 var a=$("#app");if(!$("#sv"))return;
 a.querySelectorAll("[data-k]").forEach(function(el){el.oninput=function(){S.draft[el.dataset.k]=el.value}});
 a.querySelectorAll("[data-up]").forEach(function(el){el.onchange=async function(){var fs=[].slice.call(el.files);if(!fs.length)return;toast("กำลังอัปโหลด...");for(var i=0;i<fs.length;i++){var pf=fs[i];var ex=(pf.name.split(".").pop()||"png").replace(/[^a-z0-9]/gi,"").toLowerCase()||"png";var p="shop/"+Date.now()+"-"+i+"."+ex;var up=await sb.storage.from("covers").upload(p,pf);if(up.error){toast("อัปโหลดไม่สำเร็จ: "+up.error.message);return}var u=sb.storage.from("covers").getPublicUrl(p).data.publicUrl;if(el.dataset.up==="deco"){S.draft.deco=(S.draft.deco||[]).concat(u)}else S.draft[el.dataset.up]=u}toast("อัปโหลดแล้ว อย่าลืมกดบันทึก");render()}});
 $("#qrt").onclick=function(){var p=S.draft.pp;if(!p){toast("กรอกพร้อมเพย์ก่อน");return}$("#qrp").innerHTML='<div class="qr">'+ppQR(p,1)+'</div><p class="mute c">สแกนด้วยแอปธนาคาร แล้วเช็กว่าชื่อผู้รับถูกต้อง (ไม่ต้องโอนจริง)</p>'};
 $("#sv").onclick=async function(){var b=$("#sv");b.disabled=true;var r=await sb.from("shop_settings").upsert({id:1,data:S.draft});b.disabled=false;if(r.error){toast("บันทึกไม่สำเร็จ: "+r.error.message);return}CFG=Object.assign({},DEF,S.draft);applyCFG();toast("บันทึกแล้ว ✨");render()};
}
if(sb)boot();
